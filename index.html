<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Herramientas DJI GT</title>
<style>
  :root{
    --rail:#111318; --rail-2:#1b1e26; --txt:#ffffff; --txt-2:rgba(255,255,255,.62);
    --accent:#2563eb; --bg:#f3f4f7;
    --ancho:76px; --alto-movil:62px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

  /* ===== Barra lateral ===== */
  .rail{position:fixed;left:0;top:0;bottom:0;width:var(--ancho);background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:10;box-shadow:1px 0 0 rgba(255,255,255,.05)}
  .rail .logo{width:44px;margin:2px 0 14px;opacity:.95}
  .rail nav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
  .ir{position:relative;width:64px;border:none;background:transparent;color:var(--txt-2);border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 11px/1.1 inherit;transition:.15s}
  .ir svg{width:24px;height:24px}
  .ir:hover{background:rgba(255,255,255,.07);color:#fff}
  .ir[aria-current="page"]{background:rgba(37,99,235,.22);color:#fff}
  .ir[aria-current="page"]::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
  .ir[aria-current="page"] svg{color:#8fb1ff}

  /* ===== Contenido ===== */
  main{position:fixed;left:var(--ancho);right:0;top:0;bottom:0;background:var(--bg)}
  main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  main iframe.on{display:block}
  .cargando{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8b93a1;font:600 14px inherit;gap:10px}
  .cargando.on{display:flex}
  .cargando i{width:22px;height:22px;border-radius:50%;border:3px solid #d5dae2;border-top-color:var(--accent);animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .aviso{position:fixed;left:50%;top:18px;transform:translate(-50%,-12px);background:#0e9f6e;color:#fff;padding:12px 18px;border-radius:12px;font:700 14px/1.3 inherit;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
  .aviso.on{opacity:1;transform:translate(-50%,0)}

  /* ===== Celular: la barra pasa abajo ===== */
  @media (max-width:720px){
    .rail{top:auto;right:0;width:auto;height:calc(var(--alto-movil) + env(safe-area-inset-bottom));flex-direction:row;justify-content:center;padding:4px 8px env(safe-area-inset-bottom);box-shadow:0 -1px 0 rgba(255,255,255,.06)}
    .rail .logo{display:none}
    .rail nav{flex-direction:row;justify-content:space-around;max-width:420px}
    .ir{width:auto;flex:1;padding:8px 4px 6px}
    .ir[aria-current="page"]::before{left:28%;right:28%;top:-4px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
    main{left:0;bottom:calc(var(--alto-movil) + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
  <aside class="rail">
    <img class="logo" src="recepcion/logo.png" alt="DJI">
    <nav id="nav" aria-label="Apartados"></nav>
  </aside>
  <main id="contenido">
    <div class="cargando" id="cargando"><i></i>Cargando…</div>
  </main>

<div class="aviso" id="aviso"></div>
<script src="nube.js"></script>
<script>
/* Apartados de la app. Para agregar uno nuevo: su carpeta + una línea aquí. */
const ICONOS = {
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20.5l1.5-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8 10h8M8 14h5"/></svg>',
  personas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg>',
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/><path d="M7.5 5.5l9 5"/></svg>'
};
const SECCIONES = [
  {id:'mensajes',  nombre:'Mensajes',  titulo:'Mensajes para clientes',  src:'mensajes/index.html',  icono:'chat'},
  {id:'recepcion', nombre:'Recepción', titulo:'Recepción de mercadería', src:'recepcion/index.html', icono:'caja'},
  {id:'clientes',  nombre:'Clientes',  titulo:'Clientes en espera de producto', src:'clientes/index.html', icono:'personas'}
];
const LS = 'dji_app_seccion';
const nav = document.getElementById('nav'), cont = document.getElementById('contenido'), cargando = document.getElementById('cargando');
const marcos = {};

nav.innerHTML = SECCIONES.map(s => `<button class="ir" data-id="${s.id}" title="${s.titulo}">${ICONOS[s.icono]}<span>${s.nombre}</span></button>`).join('');
nav.addEventListener('click', e => { const b = e.target.closest('.ir'); if(b) ir(b.dataset.id); });

function ir(id){
  const s = SECCIONES.find(x => x.id === id) || SECCIONES[0];
  // cada apartado se carga una sola vez y se queda abierto (no se pierde lo que estabas haciendo)
  if(!marcos[s.id]){
    const f = document.createElement('iframe');
    f.title = s.titulo;
    f.allow = 'clipboard-read; clipboard-write; web-share; fullscreen';
    f.addEventListener('load', () => { if(f.classList.contains('on')) cargando.classList.remove('on'); f.dataset.listo = '1'; });
    f.src = s.src;
    cont.appendChild(f);
    marcos[s.id] = f;
  }
  for(const [k, f] of Object.entries(marcos)) f.classList.toggle('on', k === s.id);
  cargando.classList.toggle('on', !marcos[s.id].dataset.listo);
  nav.querySelectorAll('.ir').forEach(b => {
    if(b.dataset.id === s.id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.title = `${s.nombre} · Herramientas DJI GT`;
  try{ localStorage.setItem(LS, s.id); }catch(e){}
  if(location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id);
  setTimeout(() => { try{ marcos[s.id].contentWindow.focus(); }catch(e){} }, 60);
}
window.addEventListener('hashchange', () => ir(location.hash.slice(1)));

let inicio = location.hash.slice(1);
if(!SECCIONES.some(s => s.id === inicio)){ try{ inicio = localStorage.getItem(LS) || ''; }catch(e){ inicio = ''; } }
ir(inicio || SECCIONES[0].id);

// recién conectado con el link de la tienda
if(window.Nube && Nube.recienConectado()){
  const av = document.getElementById('aviso');
  av.textContent = '☁️ Listo: esta computadora quedó conectada a la nube de la tienda';
  av.classList.add('on'); setTimeout(() => av.classList.remove('on'), 4500);
}
</script>
</body>
</html>
